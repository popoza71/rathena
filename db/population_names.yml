          "ตัวตึง", "นักฟาร์ม", "ใจเย็น", "หัวร้อน",
          "หล่อ", "น่ารัก", "อ้วน", "บาง", "ไว",
          "มือใหม่", "เก๋า", "ไร้เทียมทาน", "เลือดเย็น",
          "วาปไว", "ฟาร์มหนัก"
        ]

      Nouns:
        [
          "นักดาบ", "แอส", "ฮัน", "พระ", "วิ",
          "พ่อค้า", "อัลเค", "ไนท์", "ครูเสด", "แชมป์",
          "นักล่า", "คนขายของ", "เด็กปั้น", "นักตีบวก",
          "นักเปิดกล่อง", "สายแบก", "มือบัพ", "มือแจก",
          "นักฟาร์ม", "ตัวป่วน"
        ]

      Blocklist:
        [
          "gm",
          "admin",
          "staff",
          "mod",
          "hack",
          "cheat",
          "bot"
        ]

  # =========================================================
  # Default Profile
  # =========================================================
  - Profile: default
    Strategy: syllables
    MinLen: 2
    MaxLen: 22

  # =========================================================
  # RO Thai Style
  # =========================================================
