###########################################################################
# Population Engine Names Database
###########################################################################
#
# Fake PC name generation profiles for population shells.
# Loaded at map-server startup and with @reloadpopengine.
# Referenced from population_engine.yml via NameProfile: <key>.
#
###########################################################################
# - GlobalLists:                 Shared word pools used by all name generation strategies.
#     Prefixes:                  [ list ] โ€” short prefix syllables.
#     SyllablesStart/Mid/End:    [ list ] โ€” syllable parts for the syllables strategy.
#     Adjectives / Nouns:        [ list ] โ€” word pools for the adjective_noun strategy.
#     Blocklist:                 [ list ] โ€” substrings to reject (case-insensitive).
# - Profile: <key>               Named profile; reference via NameProfile: in population_engine.yml.
#     Strategy: <value>          Name generation method:
#       syllables      โ€” concatenate Start + Mid + End syllable parts.
#       adjective_noun โ€” combine a random Adjective + Noun.
#       adj_noun       โ€” alias for adjective_noun.
#       pick_one       โ€” pick a full name directly from a Names list.
#       bot_index      โ€” Bot_<index> (fallback / debug).
#       prefix_number  โ€” <prefix><number>.
###########################################################################

Header:
  Type: POPULATION_NAMES_DB
  Version: 1

Body:

  # =========================================================
  # Global Lists
  # =========================================================
  - GlobalLists:

      Prefixes:
